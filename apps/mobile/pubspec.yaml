name: biume_mobile
description: "Mobile version for Biume"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^17.5.0
  dio: ^5.11.0
  retrofit: ^4.10.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.34.3
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.0.0
  cryptography: ^2.9.0
  record: ^7.1.1
  just_audio: ^0.10.6
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.0
  posthog_flutter: ^5.36.6
  intl: ^0.20.3
  crypto: ^3.0.7
  workmanager: ^0.10.9
  sqlite3: ^3.5.2
  collection: ^1.19.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.9
  drift_dev: ^2.34.5
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true

  # Les deux familles sont embarquées, jamais téléchargées : l'application se
  # lance régulièrement sans réseau, et une police arrivée à froid décalerait
  # toute la mise en page au premier lancement.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      # `@biume/mobile` est exclu : son `check-types` est `flutter analyze`,
      # et Flutter n'est pas installé sur ce runner. Le job `mobile` s'en
      # charge, avec sa propre chaîne d'outils.
      - name: Vérifier les types
        run: bun run check-types --filter='!@biume/mobile'

      - name: Tests du web
        run: bun --filter @biume/web test

      - name: Tests des contrats partagés
        run: bun --filter @biume/contracts test

      - name: Tests de l'authentification
        run: bun --filter @biume/auth test

  mobile:
    name: Analyse et tests Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get
        working-directory: apps/mobile

      - name: Générer le code
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile

      - name: Analyser
        run: flutter analyze
        working-directory: apps/mobile

      - name: Tester
        run: flutter test
        working-directory: apps/mobile
